name: Ricursive Intelligence
description: >-
  Ricursive Intelligence is a frontier AI laboratory building self-improving
  systems to reinvent chip design, closing the loop between artificial
  intelligence and the hardware that powers it. Founded by researchers behind
  work such as AlphaChip (Nature 2021), RL-CCD (DAC Best Paper 2023), Insta
  (DAC Best Paper 2025), and C3PO (ASP-DAC Best Paper 2026), and contributors
  to major AI models and accelerators (Gemini, Claude, Grok, TPUs), the company
  raised $335M from Sequoia, Lightspeed, DST Global, and NVentures. As of this
  profile the company operates as a research lab with a public marketing site
  and careers page but no publicly documented developer API, SDKs, or developer
  portal.
